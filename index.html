<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Folio IPG Premium v15.2 - Pengurusan Folio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <!-- HALAMAN LOG MASUK & DAFTAR KENDIRI -->
    <div id="login-page" class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="max-w-md w-full glass-card rounded-[2.5rem] p-8 md:p-10 text-center shadow-2xl">
            <div class="w-20 h-20 bg-blue-600/20 rounded-3xl mx-auto flex items-center justify-center mb-4 border border-blue-500/30">
                <i class="fas fa-graduation-cap text-3xl text-blue-400"></i>
            </div>
            <h1 class="text-2xl md:text-3xl font-extrabold tracking-tight text-white mb-1 uppercase">E-FOLIO IPG</h1>
            <p class="text-xs font-semibold text-slate-400 mb-6">Sistem Folio Digital & Audit Akademik IPGM</p>

            <!-- TAB TUKAR MOD -->
            <div class="flex bg-slate-800/80 p-1 rounded-2xl mb-6 border border-slate-700">
                <button type="button" onclick="switchAuthTab('login')" id="btn-tab-login" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all bg-blue-600 text-white">LOG MASUK</button>
                <button type="button" onclick="switchAuthTab('register')" id="btn-tab-reg" class="flex-1 py-2.5 text-xs font-bold rounded-xl transition-all text-slate-400 hover:text-white">DAFTAR BAHARU</button>
            </div>

            <!-- BORANG LOG MASUK -->
            <form id="form-login" class="space-y-4">
                <div class="text-left">
                    <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">Emel Google IPG / Username</label>
                    <input type="text" id="login-username" placeholder="ipgm-3679@moe-dl.edu.my" required class="w-full mt-1 px-5 py-3.5 bg-slate-900/80 border border-slate-700 rounded-2xl text-xs font-bold text-white outline-none focus:border-blue-500">
                </div>
                <button type="submit" id="btn-submit-login" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-widest transition-all shadow-lg shadow-blue-600/30">
                    Masuk Dengan Akaun Google
                </button>
            </form>

            <!-- BORANG DAFTAR KENDIRI -->
            <form id="form-register" class="space-y-3 hidden text-left">
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">Nama Penuh</label>
                    <input type="text" id="reg-nama" placeholder="ABDUL MANAF BIN AHMAD" required class="w-full mt-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">Emel Google IPG/KPM</label>
                    <input type="email" id="reg-email" placeholder="nama@moe-dl.edu.my" required class="w-full mt-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">No. Pekerja</label>
                        <input type="text" id="reg-nopekerja" placeholder="32890" class="w-full mt-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">Gred</label>
                        <input type="text" id="reg-gred" placeholder="DG48" class="w-full mt-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-slate-400 ml-1">Jabatan / Unit</label>
                    <input type="text" id="reg-jabatan" placeholder="UNIT KOKURIKULUM" class="w-full mt-1 px-4 py-3 bg-slate-900/80 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                </div>
                <button type="submit" id="btn-submit-reg" class="w-full mt-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl text-xs uppercase tracking-widest transition-all shadow-lg shadow-emerald-600/30">
                    Daftar & Masuk Ke Sistem
                </button>
            </form>
        </div>
    </div>

    <!-- PAPAN PEMUKAI (DASHBOARD) -->
    <div id="dashboard-page" class="hidden min-h-screen bg-slate-950">
        <nav class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50 px-6 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center font-black text-xl">IPG</div>
                    <div>
                        <h2 class="text-sm font-black uppercase text-white tracking-wider">E-Folio Portal</h2>
                        <p class="text-[9px] font-bold text-blue-400 uppercase tracking-widest">Pengurusan Digital Pensyarah</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openProfileModal()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs font-bold text-slate-200">
                        <i class="fas fa-user-gear mr-1 text-blue-400"></i> Kemaskini Profil
                    </button>
                    <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-400 ml-2">
                        <i class="fas fa-power-off text-base"></i>
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 md:p-10">
            <div class="glass-card rounded-3xl p-6 md:p-8 mb-8 flex flex-col md:flex-row items-center gap-6">
                <div class="w-24 h-24 bg-slate-800 rounded-2xl border-2 border-blue-500/40 overflow-hidden flex items-center justify-center text-3xl font-black text-blue-400">
                    <span id="prof-initials">P</span>
                </div>
                <div class="text-center md:text-left space-y-2 flex-1">
                    <span id="prof-role" class="px-3 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 rounded-full text-[9px] font-black uppercase">Pensyarah</span>
                    <h1 id="prof-name" class="text-2xl md:text-3xl font-black text-white uppercase">-</h1>
                    <div class="flex flex-wrap gap-4 text-xs font-semibold text-slate-400 pt-1">
                        <div><i class="fas fa-id-badge text-blue-400 mr-1.5"></i>Gred: <span id="prof-gred" class="text-white">-</span></div>
                        <div><i class="fas fa-building text-blue-400 mr-1.5"></i>Unit: <span id="prof-jabatan" class="text-white">-</span></div>
                        <div><i class="fas fa-envelope text-blue-400 mr-1.5"></i>Emel: <span id="prof-email" class="text-white">-</span></div>
                    </div>
                </div>
            </div>

            <div class="glass-card rounded-3xl overflow-hidden border border-slate-800">
                <div class="p-6 border-b border-slate-800 flex justify-between items-center">
                    <h3 class="text-sm font-extrabold uppercase text-white tracking-wider">Senarai Rekod Folio</h3>
                    <span id="data-count" class="px-3 py-1 bg-blue-600/20 text-blue-400 rounded-full text-xs font-black">0 Rekod</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900/80 text-slate-400 font-extrabold uppercase text-[9px] tracking-wider border-b border-slate-800">
                            <tr>
                                <th class="p-4">Tahun</th>
                                <th class="p-4">Kategori</th>
                                <th class="p-4">Tajuk Dokumen</th>
                                <th class="p-4 text-center">Tindakan</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-800/50 font-medium text-slate-300">
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL KEMASKINI PROFIL -->
    <div id="modal-profile" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-card max-w-lg w-full rounded-3xl p-8 border border-slate-700">
            <h3 class="text-lg font-black uppercase text-white mb-4">Kemaskini Profil Pensyarah</h3>
            <form id="form-update-profile" class="space-y-4">
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-slate-400">Nama Penuh</label>
                    <input type="text" id="prof-edit-nama" required class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-[10px] font-extrabold uppercase text-slate-400">No. Pekerja</label>
                        <input type="text" id="prof-edit-nopekerja" class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                    </div>
                    <div>
                        <label class="text-[10px] font-extrabold uppercase text-slate-400">Gred</label>
                        <input type="text" id="prof-edit-gred" class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-extrabold uppercase text-slate-400">Jabatan / Unit</label>
                    <input type="text" id="prof-edit-jabatan" class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-xs font-bold text-white outline-none">
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="closeProfileModal()" class="flex-1 py-3 bg-slate-800 text-slate-400 font-bold rounded-xl text-xs uppercase">Batal</button>
                    <button type="submit" class="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl text-xs uppercase shadow-lg shadow-blue-600/30">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxpehf-tDk3hFCSZDzVdbYWVhhLh8V6z5wADmSqrMZSomEAz_ODSYjTgYFo2odmD5LAjQ/exec";
        let currentUser = null;

        window.onload = () => {
            const saved = localStorage.getItem('efolio_user');
            if (saved) {
                currentUser = JSON.parse(saved);
                showDashboard();
            }
        };

        function switchAuthTab(tab) {
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            document.getElementById('btn-tab-login').className = tab === 'login' ? 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-blue-600 text-white' : 'flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white';
            document.getElementById('btn-tab-reg').className = tab === 'register' ? 'flex-1 py-2.5 text-xs font-bold rounded-xl bg-emerald-600 text-white' : 'flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white';
        }

        // LOG MASUK
        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-login');
            btn.innerText = 'MEMPROSES...'; btn.disabled = true;

            const username = document.getElementById('login-username').value.trim();
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'login', username: username, password: '' })
                });
                const data = await res.json();
                if (data.result === 'success') {
                    currentUser = data.user;
                    localStorage.setItem('efolio_user', JSON.stringify(currentUser));
                    showDashboard();
                } else {
                    alert(data.message || 'Log masuk gagal');
                }
            } catch (err) { alert('Ralat pelayan: ' + err.message); }
            btn.innerText = 'Masuk Dengan Akaun Google'; btn.disabled = false;
        });

        // DAFTAR KENDIRI
        document.getElementById('form-register').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-reg');
            btn.innerText = 'MENDAFTAR...'; btn.disabled = true;

            const payload = {
                action: 'selfRegister',
                username: document.getElementById('reg-email').value.trim(),
                nama_penuh: document.getElementById('reg-nama').value.trim(),
                no_pekerja: document.getElementById('reg-nopekerja').value.trim(),
                gred: document.getElementById('reg-gred').value.trim(),
                jabatan: document.getElementById('reg-jabatan').value.trim()
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.result === 'success') {
                    currentUser = data.user;
                    localStorage.setItem('efolio_user', JSON.stringify(currentUser));
                    alert(data.message || 'Pendaftaran Berjaya!');
                    showDashboard();
                } else {
                    alert(data.message || 'Pendaftaran gagal');
                }
            } catch (err) { alert('Ralat sambungan pelayan: ' + err.message); }
            btn.innerText = 'Daftar & Masuk Ke Sistem'; btn.disabled = false;
        });

        function showDashboard() {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard-page').classList.remove('hidden');

            document.getElementById('prof-name').innerText = currentUser.Nama_Penuh || currentUser.Username;
            document.getElementById('prof-gred').innerText = currentUser.Gred || '-';
            document.getElementById('prof-jabatan').innerText = currentUser.Jabatan || '-';
            document.getElementById('prof-email').innerText = currentUser.Username;
            document.getElementById('prof-initials').innerText = (currentUser.Nama_Penuh || 'P').charAt(0).toUpperCase();

            loadData();
        }

        async function loadData() {
            const body = document.getElementById('table-body');
            body.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-500 font-bold uppercase">Memuatkan data...</td></tr>';

            try {
                const url = `${API_URL}?sheet=Data_Folio&username=${encodeURIComponent(currentUser.Username)}&role=${encodeURIComponent(currentUser.Role || 'Pensyarah')}`;
                const res = await fetch(url);
                const records = await res.json();

                document.getElementById('data-count').innerText = `${records.length} Rekod`;

                if (!Array.isArray(records) || records.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-slate-500 italic">Tiada rekod dijumpai.</td></tr>';
                    return;
                }

                body.innerHTML = records.map(r => `
                    <tr class="hover:bg-slate-900/50 transition-all">
                        <td class="p-4 font-bold text-blue-400">${r.Tahun || '-'}</td>
                        <td class="p-4 font-bold uppercase text-slate-300">${r.Kategori || '-'}</td>
                        <td class="p-4 font-extrabold text-white uppercase">${r.Nama || r.Keterangan || '-'}</td>
                        <td class="p-4 text-center">
                            ${r.Pautan ? `<a href="${r.Pautan}" target="_blank" class="px-3 py-1 bg-blue-600/20 text-blue-400 hover:bg-blue-600 hover:text-white rounded-lg transition-all font-bold text-[10px]">Buka Link</a>` : '-'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                body.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-red-400 font-bold">Gagal memuatkan data.</td></tr>';
            }
        }

        function openProfileModal() {
            document.getElementById('prof-edit-nama').value = currentUser.Nama_Penuh || '';
            document.getElementById('prof-edit-nopekerja').value = currentUser.No_Pekerja || '';
            document.getElementById('prof-edit-gred').value = currentUser.Gred || '';
            document.getElementById('prof-edit-jabatan').value = currentUser.Jabatan || '';
            document.getElementById('modal-profile').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('modal-profile').classList.add('hidden');
        }

        document.getElementById('form-update-profile').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                action: 'updateProfile',
                username: currentUser.Username,
                nama_penuh: document.getElementById('prof-edit-nama').value,
                no_pekerja: document.getElementById('prof-edit-nopekerja').value,
                gred: document.getElementById('prof-edit-gred').value,
                jabatan: document.getElementById('prof-edit-jabatan').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.result === 'success') {
                    currentUser.Nama_Penuh = payload.nama_penuh;
                    currentUser.No_Pekerja = payload.no_pekerja;
                    currentUser.Gred = payload.gred;
                    currentUser.Jabatan = payload.jabatan;
                    localStorage.setItem('efolio_user', JSON.stringify(currentUser));
                    closeProfileModal();
                    showDashboard();
                }
            } catch (err) { alert('Gagal kemaskini profil!'); }
        });

        function logout() {
            localStorage.removeItem('efolio_user');
            location.reload();
        }
    </script>
</body>
</html>
